services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${USER_DB_NAME}"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks:
      - backend-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "50051:50051"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${USER_DB_NAME}?sslmode=disable
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET}
      - GRPC_PORT=:50051
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend-network

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    ports:
      - "50052:50052"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${CATALOG_DB_NAME}?sslmode=disable
      - GRPC_PORT=:50052
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_USE_SSL=${MINIO_SECURE}
      - MINIO_RAW_BUCKET=${MINIO_RAW_BUCKET:-soundwave-raw}
      - MINIO_AUDIO_BUCKET=${MINIO_AUDIO_BUCKET:-soundwave-audio}
      - MINIO_COVERS_BUCKET=${MINIO_COVERS_BUCKET:-soundwave-covers}
      - MINIO_UPLOAD_EXPIRY=15m
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - backend-network

  api-gateway:
    build:
      context: .
      dockerfile: api-geteway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=:8080
      - JWT_SECRET=${JWT_SECRET}
      - USER_SERVICE_GRPC_ADDR=user-service:50051
      - USER_SERVICE_TIMEOUT=5s
      - CATALOG_SERVICE_GRPC_ADDR=catalog-service:50052
      - CATALOG_SERVICE_TIMEOUT=5s
    depends_on:
      - user-service
      - catalog-service
    networks:
      - backend-network

volumes:
  pgdata:
  miniodata:

networks:
  backend-network:
    driver: bridge