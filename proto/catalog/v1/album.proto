syntax = "proto3";

package catalog.v1;

option go_package = "github.com/Lama189/soundwave-platform/gen/go/catalog/v1;catalogpb";

import "google/protobuf/timestamp.proto";

service AlbumService {
  rpc CreateAlbum(CreateAlbumRequest) returns (CreateAlbumResponse);
  rpc GetAlbum(GetAlbumRequest) returns (GetAlbumResponse);
  rpc GetAlbums(GetAlbumsRequest) returns (GetAlbumsResponse);
  rpc GetAlbumsByArtistId(GetAlbumsByArtistIdRequest) returns (GetAlbumsByArtistIdResponse);
  rpc UpdateAlbum(UpdateAlbumRequest) returns (UpdateAlbumResponse);
  rpc DeleteAlbum(DeleteAlbumRequest) returns (DeleteAlbumResponse);
}

message Album {
  string id = 1;
  string artist_id = 2;
  string title = 3;
  string description = 4;
  string cover_key = 5;
  int64 price = 6;
  string currency = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateAlbumRequest {
  string artist_id = 1;
  string title = 2;
  string description = 3;
  string cover_key = 4;
  int64 price = 5;
  string currency = 6;
  string user_id = 7;
}

message CreateAlbumResponse {
  Album album = 1;
}

message GetAlbumRequest {
  string album_id = 1;
}

message GetAlbumResponse {
  Album album = 1;
}

message GetAlbumsRequest {
  repeated string album_ids = 1;
}

message GetAlbumsResponse {
  repeated Album albums = 1;
}

message GetAlbumsByArtistIdRequest {
  string artist_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetAlbumsByArtistIdResponse {
  repeated Album albums = 1;
}

message UpdateAlbumRequest {
  string album_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  string cover_key = 5;
  int64 price = 6;
  string currency = 7;
}

message UpdateAlbumResponse {
  Album album = 1;
}

message DeleteAlbumRequest {
  string album_id = 1;
  string user_id = 2;
}

message DeleteAlbumResponse {}
