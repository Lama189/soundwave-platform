syntax = "proto3";

package catalog.v1;

option go_package = "github.com/Lama189/soundwave-platform/gen/go/catalog/v1;catalogpb";

import "google/protobuf/timestamp.proto";

service TrackService {
  rpc UploadTrack(UploadTrackRequest) returns (UploadTrackResponse);
  rpc ConfirmUpload(ConfirmUploadRequest) returns (ConfirmUploadResponse);
  rpc CompleteProcessing(CompleteProcessingRequest) returns (CompleteProcessingResponse);
  rpc FailProcessing(FailProcessingRequest) returns (FailProcessingResponse);
  rpc GetTrack(GetTrackRequest) returns (GetTrackResponse);
  rpc GetTracks(GetTracksRequest) returns (GetTracksResponse);
  rpc GetTrackStream(GetTrackStreamRequest) returns (GetTrackStreamResponse);
  rpc LikeTrack(LikeTrackRequest) returns (LikeTrackResponse);
  rpc UnlikeTrack(UnlikeTrackRequest) returns (UnlikeTrackResponse);
  rpc GetLikedTracks(GetLikedTracksRequest) returns (GetLikedTracksResponse);
}

message Track {
  string id = 1;
  string artist_id = 2;
  optional string album_id = 3;
  string title = 4;
  int64 duration_seconds = 5;
  string cover_key = 6;
  string file_key = 7;
  string preview_key = 8;
  string raw_key = 9;
  string status = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  int64 price = 13;
  string currency = 14;
}

message UploadTrackRequest {
  string user_id = 1;
  string title = 2;
  string file_name = 3;
  optional string album_id = 4;
  int64 price = 5;
  string currency = 6;
}

message UploadTrackResponse {
  Track track = 1;
  string upload_url = 2;
}

message ConfirmUploadRequest {
  string track_id = 1;
  string user_id = 2;
}

message ConfirmUploadResponse {
  Track track = 1;
}

message CompleteProcessingRequest {
  string track_id = 1;
  int64 duration_seconds = 2;
  string file_key = 3;
  string preview_key = 4;
  string cover_key = 5;
}

message CompleteProcessingResponse {
  Track track = 1;
}

message FailProcessingRequest {
  string track_id = 1;
}

message FailProcessingResponse {}

message GetTrackRequest {
  string track_id = 1;
}

message GetTrackResponse {
  Track track = 1;
}

message GetTracksRequest {
  repeated string track_ids = 1;
}

message GetTracksResponse {
  repeated Track tracks = 1;
}

message GetTrackStreamRequest {
  string track_id = 1;
  optional string user_id = 2;
}

message GetTrackStreamResponse {
  string stream_url = 1;
  bool is_preview = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message LikeTrackRequest {
  string track_id = 1;
  string user_id = 2;
}

message LikeTrackResponse {}

message UnlikeTrackRequest {
  string track_id = 1;
  string user_id = 2;
}

message UnlikeTrackResponse {}

message GetLikedTracksRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetLikedTracksResponse {
  repeated Track tracks = 1;
}


