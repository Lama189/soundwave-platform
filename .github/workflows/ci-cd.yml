name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  proto-lint:
    name: Protobuf Contracts Lint & Breaking Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Buf CLI
        uses: bufbuild/buf-setup-action@v1.50.0

      - name: Lint Protobuf
        uses: bufbuild/buf-lint-action@v1
        with:
          input: "proto"

      - name: Check Breaking Changes
        if: github.event_name == 'pull_request'
        uses: bufbuild/buf-breaking-action@v1
        with:
          input: "proto"
          against: "https://github.com/${{ github.repository }}.git#branch=main"

  go-ci:
    name: Go Lint, Security & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: "**/*.sum"

      - name: Verify Code Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v '^gen/' || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet
        run: |
          for mod in api-geteway user-service catalog-service order-service payment-service billing-service pkg; do
            echo "==> Running go vet for $mod"
            (cd "$mod" && go vet ./...)
          done

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Go Security Vulnerability Audit (govulncheck)
        run: |
          for mod in api-geteway user-service catalog-service order-service payment-service billing-service pkg; do
            echo "==> Auditing $mod"
            (cd "$mod" && govulncheck ./...)
          done

      - name: Run Go Unit Tests
        run: |
          for mod in api-geteway user-service catalog-service order-service payment-service billing-service pkg; do
            echo "==> Testing $mod"
            (cd "$mod" && go test -v -race -cover ./...)
          done

  python-ci:
    name: Audio Worker Lint & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./audio-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "audio-worker/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit Python dependencies for security CVEs
        run: uvx pip-audit

      - name: Run Ruff Linter
        run: uvx ruff check .

  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [proto-lint, go-ci, python-ci]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: user-service
            image: user-service
            context: .
            dockerfile: user-service/Dockerfile
          - name: catalog-service
            image: catalog-service
            context: .
            dockerfile: catalog-service/Dockerfile
          - name: order-service
            image: order-service
            context: .
            dockerfile: order-service/Dockerfile
          - name: payment-service
            image: payment-service
            context: .
            dockerfile: payment-service/Dockerfile
          - name: api-gateway
            image: api-gateway
            context: .
            dockerfile: api-geteway/Dockerfile
          - name: audio-worker
            image: audio-worker
            context: ./audio-worker
            dockerfile: audio-worker/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repository name for GHCR
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.service.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
